; PlatformIO project for the M5Stack Core (ESP32, ILI9341 320x240, 3 buttons).
; Scans for several AC Infinity CloudCom A1 devices at once, decodes
; temperature/humidity/VPD, and shows them on the built-in screen, with a
; button-triggered historical temperature graph.

[env:m5stack-core-esp32-16M]
platform = espressif32
board = m5stack-core-esp32-16M
framework = arduino

; The board's own default partition table is sized for 4MB flash (each
; OTA app slot only ~1.3MB) regardless of this board actually having
; 16MB -- use a scheme that takes advantage of the real flash size so
; there's room for OTA (two full copies of the firmware at once) plus
; headroom to grow.
board_build.partitions = default_16MB.csv

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
    m5stack/M5Stack@^0.4.3
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

monitor_speed = 115200

; OTA updates over WiFi, once the device is running and on the network --
; no USB needed. Usage:
;   OTA_PASSWORD=<value from include/config.h> pio run -e m5stack_ota -t upload
; (kept out of this committed file since it's a secret; must match config.h)
[env:m5stack_ota]
extends = env:m5stack-core-esp32-16M
upload_protocol = espota
upload_port = ac-infinity-m5stack.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
